<section data-component="03_Logout" aria-labelledby="logout-title" aria-describedby="logout-status logout-error" aria-busy="false"><div class="logout-box"><h2 id="logout-title">Encerrar investigação?</h2><p>O acesso será revogado neste dispositivo e você retornará à tela de entrada.</p><div class="actions"><button type="button" id="logout-confirm" aria-busy="false">ENCERRAR INVESTIGAÇÃO</button><button type="button" class="secondary" id="logout-cancel">RETOMAR TERMINAL</button></div><p data-state="loading" id="logout-status" hidden role="status" aria-live="polite" aria-atomic="true">Encerrando sessão…</p><p data-state="error" id="logout-error" hidden role="alert" aria-live="assertive" aria-atomic="true" tabindex="-1">Não foi possível encerrar a sessão.</p></div></section>
<script>(function() {
  var root = document.querySelector('[data-component="03_Logout"]'); if (!root) return;
  var confirmButton = root.querySelector('#logout-confirm'); var cancelButton = root.querySelector('#logout-cancel'); var loading = root.querySelector('[data-state="loading"]'); var error = root.querySelector('[data-state="error"]'); var completed = false;
  function clearState() {
    window.currentSessionToken = null; window.currentUser = null; window.currentUserId = null;
    try { window.localStorage.removeItem('sombras.session'); } catch (ignored) {}
  }
  function setBusy(busy, message) {
    root.setAttribute('aria-busy', String(Boolean(busy)));
    confirmButton.disabled = Boolean(busy);
    cancelButton.disabled = Boolean(busy);
    confirmButton.setAttribute('aria-busy', String(Boolean(busy)));
    confirmButton.textContent = busy ? 'ENCERRANDO…' : 'ENCERRAR INVESTIGAÇÃO';
    if (loading) {
      if (message) loading.textContent = message;
      loading.hidden = !busy;
    }
  }
  function showError() {
    error.hidden = false;
    try { error.focus(); } catch (ignored) {}
  }
  cancelButton.addEventListener('click', function() { if (!completed) window.location.hash = 'terminal'; });
  confirmButton.addEventListener('click', function() {
    if (completed) return;
    completed = true;
    setBusy(true, 'Encerrando sessão…');
    error.hidden = true;
    var token = window.currentSessionToken || '';
    function finish(response) {
      if (response === false) {
        completed = false;
        setBusy(false);
        showError();
        return;
      }
      clearState();
      setBusy(true, 'Sessão encerrada. Retornando à entrada…');
      window.location.hash = 'login';
    }
    if (!token || !window.google || !google.script || !google.script.run) { finish(true); return; }
    google.script.run.withSuccessHandler(finish).withFailureHandler(function() { finish(false); }).revokeSession(token);
  });
  confirmButton.focus();
}());</script>
