<!--
  O TERMINAL: SOMBRAS DO CAPITAL
  Componente: 29_ClassroomManager.html
  Camada: Interface HTML do Google Apps Script
  Tipo: Stub de tela e contrato inicial

  PRINCIPAIS FUNCIONALIDADES
  Gerenciador de turmas.

  INTEGRAÇÕES
  Criar, editar, arquivar turmas e gerar códigos.

  CONTRATO DE FRONTEND
  - Consumir somente funções públicas expostas pelo controlador do Apps Script.
  - Nunca armazenar senha em localStorage, URL, HTML ou logs do navegador.
  - Escapar conteúdo narrativo antes de inserir HTML; preferir textContent no JavaScript.
  - Manter estados loading, vazio, sucesso e erro acessíveis.

  CONTRATO DE DADOS
  - Consumir apenas dados necessários à tela e respeitar o contrato JSON da API.
  - Não presumir campos opcionais: tratar ausência, lista vazia e resposta parcial.
  - Enviar mutações uma única vez e refletir sucesso ou erro no estado visível.

  ESTADOS E ACESSIBILIDADE
  - Implementar loading, vazio, sucesso, erro e estado desabilitado quando aplicável.
  - Preservar foco, ordem de teclado, labels associados e mensagens anunciáveis.
  - Não depender apenas de cor, animação, áudio ou hover para comunicar informação.

  SEGURANÇA E LIMITES
  - Nunca expor senha, token, dados pessoais ou detalhes técnicos no DOM ou nos logs.
  - Conteúdo remoto deve ser tratado como texto não confiável e inserido com segurança.
  - Este componente não implementa autorização, persistência ou regras de domínio.

  DIRETRIZES VISUAIS
  Interface de sistema investigativo em dark graphite, com neon apenas para evidências,
  links cruciais e estados de interação. O componente deve ser responsivo e legível para
  estudantes do Ensino Médio, com foco em narrativa, análise de dados e acessibilidade.

  STATUS DO SCAFFOLD
  O markup abaixo valida a composição e os estados mínimos da tela.
  Substituí-lo por uma implementação produtiva exige teste de fluxo, teclado e responsividade.
-->
<section data-component="29_ClassroomManager" aria-labelledby="classroom-heading" aria-describedby="classroom-description" aria-busy="false">
  <style>
    [data-component="29_ClassroomManager"] {
      --cm-bg: var(--color-deep-shadow, #0b0f10);
      --cm-panel: var(--color-dark-graphite, #141a1d);
      --cm-card: #0e1315;
      --cm-line: #2a3539;
      --cm-cyan: var(--color-neon-cyan, #68d4d0);
      --cm-amber: var(--color-warning-amber, #f0b35b);
      --cm-red: var(--color-coral-red, #e27468);
      --cm-text: var(--color-light-gray, #e8edf0);
      --cm-muted: var(--color-medium-gray, #8d9aa0);
      display: block;
      min-height: 100%;
      padding: 24px;
      color: var(--cm-text);
      background: var(--cm-bg);
      font-family: "IBM Plex Mono", "Courier New", monospace;
      box-sizing: border-box;
    }
    [data-component="29_ClassroomManager"] *,
    [data-component="29_ClassroomManager"] *::before,
    [data-component="29_ClassroomManager"] *::after { box-sizing: border-box; }
    [data-component="29_ClassroomManager"] .cm-shell { max-width: 980px; margin: 0 auto; }
    [data-component="29_ClassroomManager"] .cm-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--cm-line);
    }
    [data-component="29_ClassroomManager"] .cm-eyebrow {
      margin: 0 0 6px;
      color: var(--cm-cyan);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    [data-component="29_ClassroomManager"] h2 {
      margin: 0 0 6px;
      color: #ffffff;
      font: 700 clamp(24px, 4vw, 32px) Georgia, serif;
    }
    [data-component="29_ClassroomManager"] .cm-description {
      margin: 0;
      color: var(--cm-muted);
      font-size: 13px;
    }
    [data-component="29_ClassroomManager"] button {
      min-height: 42px;
      padding: 10px 16px;
      border: 1px solid var(--cm-cyan);
      border-radius: 4px;
      color: var(--cm-cyan);
      background: transparent;
      font: 700 12px "IBM Plex Mono", monospace;
      cursor: pointer;
      transition: background .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    [data-component="29_ClassroomManager"] button:hover:not(:disabled),
    [data-component="29_ClassroomManager"] button:focus-visible {
      background: rgba(104, 212, 208, .14);
      box-shadow: 0 0 12px rgba(104, 212, 208, .24);
    }
    [data-component="29_ClassroomManager"] button:focus-visible,
    [data-component="29_ClassroomManager"] input:focus-visible {
      outline: 2px solid var(--cm-amber);
      outline-offset: 3px;
    }
    [data-component="29_ClassroomManager"] button:disabled { cursor: wait; opacity: .52; }
    [data-component="29_ClassroomManager"] .cm-message {
      margin: 0 0 18px;
      padding: 14px 16px;
      border-left: 3px solid var(--cm-cyan);
      border-radius: 4px;
      color: var(--cm-text);
      background: var(--cm-panel);
      font-size: 13px;
    }
    [data-component="29_ClassroomManager"] .cm-error {
      border-left-color: var(--cm-red);
      color: #f7b3ac;
    }
    [data-component="29_ClassroomManager"] .cm-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    [data-component="29_ClassroomManager"] .cm-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    [data-component="29_ClassroomManager"] .cm-card,
    [data-component="29_ClassroomManager"] .cm-empty {
      padding: 18px;
      border: 1px solid var(--cm-line);
      border-radius: 6px;
      background: var(--cm-panel);
    }
    [data-component="29_ClassroomManager"] .cm-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    [data-component="29_ClassroomManager"] .cm-card h3 {
      margin: 0;
      color: #ffffff;
      font: 700 18px Georgia, serif;
      overflow-wrap: anywhere;
    }
    [data-component="29_ClassroomManager"] .cm-details {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      margin: 0;
      color: var(--cm-muted);
      font-size: 12px;
    }
    [data-component="29_ClassroomManager"] .cm-details dt { color: var(--cm-cyan); }
    [data-component="29_ClassroomManager"] .cm-details dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
    [data-component="29_ClassroomManager"] .cm-archive {
      align-self: flex-start;
      margin-top: auto;
      border-color: var(--cm-red);
      color: #f7b3ac;
    }
    [data-component="29_ClassroomManager"] .cm-archive:hover:not(:disabled),
    [data-component="29_ClassroomManager"] .cm-archive:focus-visible { background: rgba(226, 116, 104, .14); }
    [data-component="29_ClassroomManager"] .cm-empty { color: var(--cm-muted); font-size: 13px; }
    [data-component="29_ClassroomManager"] dialog {
      width: min(92vw, 480px);
      padding: 0;
      color: var(--cm-text);
      background: var(--cm-panel);
      border: 1px solid var(--cm-line);
      border-radius: 6px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .55);
    }
    [data-component="29_ClassroomManager"] dialog::backdrop { background: rgba(4, 7, 8, .78); }
    [data-component="29_ClassroomManager"] .cm-form { display: grid; gap: 14px; padding: 24px; }
    [data-component="29_ClassroomManager"] .cm-form h3 { margin: 0; color: #ffffff; font: 700 21px Georgia, serif; }
    [data-component="29_ClassroomManager"] .cm-form label { color: var(--cm-muted); font-size: 12px; }
    [data-component="29_ClassroomManager"] .cm-form input {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--cm-line);
      border-radius: 4px;
      color: var(--cm-text);
      background: var(--cm-card);
      font: 14px "IBM Plex Mono", monospace;
    }
    [data-component="29_ClassroomManager"] .cm-help { margin: -6px 0 0; color: var(--cm-muted); font-size: 11px; }
    [data-component="29_ClassroomManager"] .cm-validation { margin: 0; color: #f7b3ac; font-size: 12px; }
    [data-component="29_ClassroomManager"] .cm-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
    [data-component="29_ClassroomManager"] .cm-actions .cm-cancel { border-color: var(--cm-line); color: var(--cm-muted); }
    @media (max-width: 640px) {
      [data-component="29_ClassroomManager"] { padding: 16px; }
      [data-component="29_ClassroomManager"] .cm-header { align-items: stretch; flex-direction: column; }
      [data-component="29_ClassroomManager"] #new-class { width: 100%; }
      [data-component="29_ClassroomManager"] .cm-actions { flex-direction: column-reverse; }
      [data-component="29_ClassroomManager"] .cm-actions button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      [data-component="29_ClassroomManager"] button { transition-duration: .01ms; }
    }
  </style>

  <div class="cm-shell">
    <header class="cm-header">
      <div>
        <p class="cm-eyebrow">[ OPERAÇÃO // TURMAS ]</p>
        <h2 id="classroom-heading">Gerenciador de turmas</h2>
        <p class="cm-description" id="classroom-description">Crie e acompanhe as turmas disponíveis para a atividade.</p>
      </div>
      <button type="button" id="new-class" aria-controls="class-dialog"><span aria-hidden="true">＋</span> Nova turma</button>
    </header>

    <p data-state="loading" id="class-loading" class="cm-message" hidden role="status" aria-live="polite" aria-atomic="true">Carregando turmas…</p>
    <p data-state="error" id="class-error" class="cm-message cm-error" hidden role="alert" aria-live="assertive" aria-atomic="true" tabindex="-1">Não foi possível concluir a operação.</p>
    <p id="class-announcement" class="cm-sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <div data-slot="content" id="class-list" class="cm-list" role="list" aria-live="polite" aria-busy="false"></div>

    <dialog id="class-dialog" aria-labelledby="class-dialog-heading" aria-describedby="class-dialog-description">
      <form id="class-form" class="cm-form" novalidate>
        <h3 id="class-dialog-heading">Nova turma</h3>
        <p id="class-dialog-description" class="cm-help">Use um nome curto e reconhecível para a turma.</p>
        <label for="class-name">Nome da turma</label>
        <input id="class-name" name="name" required maxlength="160" autocomplete="off" aria-describedby="class-dialog-description class-validation">
        <p data-state="validation" id="class-validation" class="cm-validation" hidden role="alert" aria-live="assertive" tabindex="-1"></p>
        <div class="cm-actions">
          <button type="button" id="class-cancel" class="cm-cancel">Cancelar</button>
          <button type="submit" id="class-submit">Criar turma</button>
        </div>
      </form>
    </dialog>
  </div>
</section>
<script>
(function() {
  var root = document.querySelector('[data-component="29_ClassroomManager"]');
  if (!root) return;

  var form = root.querySelector('#class-form');
  var loading = root.querySelector('[data-state="loading"]');
  var error = root.querySelector('[data-state="error"]');
  var content = root.querySelector('[data-slot="content"]');
  var announcement = root.querySelector('#class-announcement');
  var dialog = root.querySelector('#class-dialog');
  var validation = root.querySelector('[data-state="validation"]');
  var newClassButton = root.querySelector('#new-class');
  var submitButton = root.querySelector('#class-submit');
  var requestSerial = 0;
  var requestBusy = false;
  var archiveInFlight = {};
  var lastTrigger = null;

  function hasScriptRunner() {
    return Boolean(window.google && window.google.script && window.google.script.run);
  }

  function announce(message) {
    if (announcement) announcement.textContent = message || '';
  }

  function setBusy(busy, message) {
    requestBusy = Boolean(busy);
    root.setAttribute('aria-busy', String(requestBusy));
    if (content) {
      content.setAttribute('aria-busy', String(requestBusy));
      if (requestBusy) content.hidden = true;
    }
    if (loading) {
      if (message) loading.textContent = message;
      loading.hidden = !requestBusy;
    }
    if (newClassButton) newClassButton.disabled = requestBusy || !hasScriptRunner();
    if (submitButton) submitButton.disabled = requestBusy;
  }

  function focusSafely(element) {
    if (!element) return;
    try { element.focus(); } catch (ignored) {}
  }

  function showError(message, moveFocus) {
    setBusy(false);
    if (error) {
      error.textContent = message || 'Não foi possível concluir a operação.';
      error.hidden = false;
      if (moveFocus) focusSafely(error);
    }
    announce(message || 'Não foi possível concluir a operação.');
  }

  function clearError() {
    if (error) {
      error.textContent = '';
      error.hidden = true;
    }
  }

  function getTeacher() {
    return window.currentUser || null;
  }

  function renderClasses(items) {
    if (!content) return;
    content.textContent = '';
    content.hidden = false;
    if (!items.length) {
      var empty = document.createElement('p');
      empty.className = 'cm-empty';
      empty.setAttribute('role', 'listitem');
      empty.textContent = 'Nenhuma turma cadastrada.';
      content.appendChild(empty);
      return;
    }
    items.forEach(function(item) {
      if (!item || typeof item !== 'object') return;
      var id = String(item.id || '').trim();
      var name = String(item.name || 'Turma sem nome').trim() || 'Turma sem nome';
      var code = String(item.code || '—').trim() || '—';
      var count = Number(item.studentCount);
      var studentCount = isFinite(count) && !isNaN(count) ? Math.max(0, Math.round(count)) : null;
      var row = document.createElement('article');
      row.className = 'cm-card';
      row.setAttribute('role', 'listitem');
      var title = document.createElement('h3');
      title.textContent = name;
      row.appendChild(title);
      var details = document.createElement('dl');
      details.className = 'cm-details';
      var codeLabel = document.createElement('dt');
      codeLabel.textContent = 'Código';
      var codeValue = document.createElement('dd');
      codeValue.textContent = code;
      var countLabel = document.createElement('dt');
      countLabel.textContent = 'Estudantes';
      var countValue = document.createElement('dd');
      countValue.textContent = studentCount == null ? '—' : String(studentCount);
      details.appendChild(codeLabel);
      details.appendChild(codeValue);
      details.appendChild(countLabel);
      details.appendChild(countValue);
      row.appendChild(details);
      if (id) {
        var archive = document.createElement('button');
        archive.type = 'button';
        archive.className = 'cm-archive';
        archive.textContent = 'Arquivar';
        archive.setAttribute('aria-label', 'Arquivar turma ' + name);
        archive.addEventListener('click', function() { archiveClass(id, name, archive); });
        row.appendChild(archive);
      }
      content.appendChild(row);
    });
  }

  function load(reason) {
    if (requestBusy) return;
    var requestId = ++requestSerial;
    clearError();
    setBusy(true, reason === 'create' ? 'Atualizando turmas após a criação…' : 'Carregando turmas…');
    if (!hasScriptRunner()) {
      showError('Servidor indisponível. As turmas não foram sincronizadas.', true);
      return;
    }
    window.google.script.run.withSuccessHandler(function(response) {
      if (requestId !== requestSerial) return;
      if (!response || !response.ok || !Array.isArray(response.data)) {
        showError('Não foi possível carregar as turmas confirmadas.', true);
        return;
      }
      renderClasses(response.data);
      setBusy(false);
      announce(response.data.length ? response.data.length + ' turma(s) carregada(s).' : 'Nenhuma turma cadastrada.');
    }).withFailureHandler(function() {
      if (requestId !== requestSerial) return;
      showError('Não foi possível carregar as turmas confirmadas.', true);
    }).getTeacherClasses(getTeacher());
  }

  function archiveClass(id, name, button) {
    if (!id || archiveInFlight[id] || !hasScriptRunner()) {
      showError('Servidor indisponível. A turma não foi arquivada.', true);
      return;
    }
    archiveInFlight[id] = true;
    button.disabled = true;
    button.setAttribute('aria-busy', 'true');
    announce('Arquivando a turma ' + name + '…');
    window.google.script.run.withSuccessHandler(function(response) {
      delete archiveInFlight[id];
      if (!response || !response.ok) {
        button.disabled = false;
        button.removeAttribute('aria-busy');
        showError('Não foi possível arquivar a turma.', true);
        return;
      }
      announce('A turma ' + name + ' foi arquivada.');
      load('archive');
    }).withFailureHandler(function() {
      delete archiveInFlight[id];
      button.disabled = false;
      button.removeAttribute('aria-busy');
      showError('Não foi possível arquivar a turma.', true);
    }).archiveClass(getTeacher(), id);
  }

  if (newClassButton) newClassButton.addEventListener('click', function() {
    if (!dialog || typeof dialog.showModal !== 'function') {
      showError('Este navegador não permite abrir o formulário de turma.', true);
      return;
    }
    lastTrigger = document.activeElement;
    validation.hidden = true;
    validation.textContent = '';
    form.reset();
    dialog.showModal();
    focusSafely(form.elements.name);
  });

  root.querySelector('#class-cancel').addEventListener('click', function() {
    if (dialog && dialog.open) dialog.close('cancel');
  });
  if (dialog) dialog.addEventListener('close', function() { focusSafely(lastTrigger || newClassButton); });

  function validateName() {
    var value = String(form.elements.name.value || '').trim();
    var valid = value.length >= 2 && value.length <= 160;
    validation.textContent = valid ? '' : 'Informe entre 2 e 160 caracteres.';
    validation.hidden = valid;
    return valid;
  }

  form.elements.name.addEventListener('input', function() {
    validateName();
  });
  form.addEventListener('submit', function(event) {
    event.preventDefault();
    if (requestBusy) return;
    if (!hasScriptRunner()) {
      showError('Servidor indisponível. A turma não foi criada.', false);
      return;
    }
    if (!validateName()) {
      focusSafely(validation);
      return;
    }
    var name = String(form.elements.name.value || '').trim();
    setBusy(true, 'Criando turma…');
    window.google.script.run.withSuccessHandler(function(response) {
      setBusy(false);
      if (!response || !response.ok) {
        validation.textContent = 'Não foi possível criar a turma.';
        validation.hidden = false;
        focusSafely(validation);
        announce('Não foi possível criar a turma.');
        return;
      }
      if (dialog && dialog.open) dialog.close('created');
      form.reset();
      load('create');
    }).withFailureHandler(function() {
      setBusy(false);
      validation.textContent = 'Não foi possível criar a turma.';
      validation.hidden = false;
      focusSafely(validation);
      announce('Não foi possível criar a turma.');
    }).createClass(getTeacher(), name);
  });

  load('initial');
}());
</script>
