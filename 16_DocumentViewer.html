<!--
  O TERMINAL: SOMBRAS DO CAPITAL
  Componente: 16_DocumentViewer.html
  Camada: Interface HTML do Google Apps Script
  Tipo: Leitor de documentos com acessibilidade e recuperação de falhas

  PRINCIPAIS FUNCIONALIDADES
  Leitor de documentos.

  INTEGRAÇÕES
  Apresenta documentos didáticos com destaque e referência interna.

  CONTRATO DE FRONTEND
  - Consumir somente funções públicas expostas pelo controlador do Apps Script.
  - Nunca armazenar senha em localStorage, URL, HTML ou logs do navegador.
  - Escapar conteúdo narrativo antes de inserir HTML; preferir textContent no JavaScript.
  - Manter estados loading, vazio, sucesso e erro acessíveis.

  CONTRATO DE DADOS
  - Consumir apenas dados necessários à tela e respeitar o contrato JSON da API.
  - Não presumir campos opcionais: tratar ausência, lista vazia e resposta parcial.
  - Enviar mutações uma única vez e refletir sucesso ou erro no estado visível.

  ESTADOS E ACESSIBILIDADE
  - Implementar loading, vazio, sucesso, erro e estado desabilitado quando aplicável.
  - Preservar foco, ordem de teclado, labels associados e mensagens anunciáveis.
  - Não depender apenas de cor, animação, áudio ou hover para comunicar informação.

  SEGURANÇA E LIMITES
  - Nunca expor senha, token, dados pessoais ou detalhes técnicos no DOM ou nos logs.
  - Conteúdo remoto deve ser tratado como texto não confiável e inserido com segurança.
  - Este componente não implementa autorização, persistência ou regras de domínio.

  DIRETRIZES VISUAIS
  Interface de sistema investigativo em dark graphite, com neon apenas para evidências,
  links cruciais e estados de interação. O componente deve ser responsivo e legível para
  estudantes do Ensino Médio, com foco em narrativa, análise de dados e acessibilidade.

  STATUS DO COMPONENTE
  Leitor integrado ao contrato de documentos, com sessão restaurável, estados anunciáveis
  e proteção contra respostas atrasadas.
-->
<section data-component="16_DocumentViewer" aria-labelledby="doc-viewer-title" aria-describedby="doc-viewer-status" aria-busy="false">
  <dialog class="doc-dialog" id="doc-dialog" aria-labelledby="doc-viewer-title" aria-describedby="doc-viewer-status" aria-modal="true">
    <div class="doc-chrome">
      <header class="doc-header">
        <div class="doc-header-main">
          <button type="button" class="doc-btn doc-return-btn" id="doc-return-btn" aria-label="Voltar para a investigação (Tecla Esc)">
            <span aria-hidden="true">←</span> Voltar <kbd>Esc</kbd>
          </button>
          <div class="doc-title-box">
            <span class="doc-badge" id="doc-badge">DOCUMENTO // EVIDÊNCIA</span>
            <h2 id="doc-viewer-title" class="doc-title">Visualizador de Documentos</h2>
          </div>
        </div>
        <div class="doc-toolbar" role="toolbar" aria-label="Controles de visualização e acessibilidade">
          <div class="doc-toolgroup" aria-label="Controle de tamanho de texto">
            <button type="button" class="doc-tool-btn" id="doc-zoom-out" title="Diminuir tamanho do texto" aria-label="Diminuir tamanho do texto">A-</button>
            <span class="doc-zoom-indicator" id="doc-zoom-level" aria-live="polite">100%</span>
            <button type="button" class="doc-tool-btn" id="doc-zoom-in" title="Aumentar tamanho do texto" aria-label="Aumentar tamanho do texto">A+</button>
          </div>
          <div class="doc-toolgroup">
            <button type="button" class="doc-tool-btn doc-contrast-btn" id="doc-contrast-btn" aria-label="Alternar modo de contraste" title="Alternar contraste e brilho para facilitar a leitura">
              <span aria-hidden="true">◐</span> <span id="doc-contrast-mode-label">Contraste: Normal</span>
            </button>
          </div>
        </div>
      </header>

      <p data-state="loading" id="doc-viewer-loading" class="doc-state-msg" hidden role="status" aria-live="polite" aria-atomic="true">Carregando documento…</p>
      <p data-state="error" id="doc-viewer-status" class="doc-state-msg doc-error-msg" hidden role="alert" aria-live="assertive" aria-atomic="true" tabindex="-1">Não foi possível carregar o documento.</p>
      <button type="button" id="doc-viewer-retry" class="doc-retry-btn" hidden>TENTAR NOVAMENTE</button>

      <div class="doc-viewport" id="doc-viewport">
        <article class="doc-paper" id="doc-paper" data-slot="content" aria-live="polite" tabindex="0">
          <p class="doc-placeholder-text">Nenhum documento carregado.</p>
        </article>
      </div>

      <!-- Barra flutuante ao selecionar texto -->
      <div class="doc-selection-toolbar" id="doc-selection-bar" hidden role="toolbar" aria-label="Ações para o trecho selecionado">
        <button type="button" class="doc-pin-btn" id="doc-pin-clue-btn">
          <span class="pin-icon" aria-hidden="true">📌</span> Fixar Trecho como Pista
        </button>
      </div>
    </div>
  </dialog>
</section>

<script>
(function() {
  var root = document.querySelector('[data-component="16_DocumentViewer"]');
  if (!root) return;

  var dialog = root.querySelector('#doc-dialog');
  var returnBtn = root.querySelector('#doc-return-btn');
  var titleEl = root.querySelector('#doc-viewer-title');
  var badgeEl = root.querySelector('#doc-badge');
  var paper = root.querySelector('#doc-paper');
  var loading = root.querySelector('[data-state="loading"]');
  var error = root.querySelector('[data-state="error"]');
  var retryBtn = root.querySelector('#doc-viewer-retry');
  var selectionBar = root.querySelector('#doc-selection-bar');
  var pinClueBtn = root.querySelector('#doc-pin-clue-btn');
  var zoomOutBtn = root.querySelector('#doc-zoom-out');
  var zoomInBtn = root.querySelector('#doc-zoom-in');
  var zoomLevelLabel = root.querySelector('#doc-zoom-level');
  var contrastBtn = root.querySelector('#doc-contrast-btn');
  var contrastModeLabel = root.querySelector('#doc-contrast-mode-label');

  var currentEvidenceId = '';
  var lastFocusedElement = null;
  var currentSelectedRange = null;
  var requestSerial = 0;

  function setBusy(busy) {
    root.setAttribute('aria-busy', busy ? 'true' : 'false');
    if (loading) loading.hidden = !busy;
  }

  function restoreUserId() {
    if (window.currentUserId) return String(window.currentUserId);
    try {
      var saved = JSON.parse(localStorage.getItem('sombras.session') || 'null');
      if (!saved || !saved.user || !saved.user.id) return '';
      window.currentUser = saved.user;
      window.currentUserId = String(saved.user.id);
      return window.currentUserId;
    } catch (e) {
      return '';
    }
  }

  function clearError() {
    if (error) error.hidden = true;
    if (retryBtn) retryBtn.hidden = true;
  }

  function showError(message) {
    setBusy(false);
    if (error) {
      error.textContent = message || 'Não foi possível carregar o documento.';
      error.hidden = false;
      try { error.focus(); } catch (e) {}
    }
    if (retryBtn) retryBtn.hidden = !currentEvidenceId;
  }

  // Gerenciamento de Escala Tipográfica (Zoom A- / A+)
  var zoomScales = [
    { size: '13px', label: '80%' },
    { size: '14px', label: '90%' },
    { size: '16px', label: '100%' },
    { size: '18px', label: '115%' },
    { size: '20px', label: '125%' },
    { size: '22px', label: '140%' },
    { size: '25px', label: '160%' }
  ];
  var currentZoomIndex = 2; // Inicia em 100% (16px)

  function applyZoom(index) {
    currentZoomIndex = Math.max(0, Math.min(zoomScales.length - 1, index));
    var cfg = zoomScales[currentZoomIndex];
    root.style.setProperty('--doc-font-size', cfg.size);
    if (zoomLevelLabel) zoomLevelLabel.textContent = cfg.label;
    if (zoomOutBtn) zoomOutBtn.disabled = (currentZoomIndex === 0);
    if (zoomInBtn) zoomInBtn.disabled = (currentZoomIndex === zoomScales.length - 1);
  }

  if (zoomOutBtn) {
    zoomOutBtn.addEventListener('click', function() { applyZoom(currentZoomIndex - 1); });
  }
  if (zoomInBtn) {
    zoomInBtn.addEventListener('click', function() { applyZoom(currentZoomIndex + 1); });
  }

  // Modos de Contraste e Brilho para Acessibilidade
  var contrastModes = [
    { key: 'normal', label: 'Contraste: Normal', cls: '' },
    { key: 'contrast', label: 'Alto Contraste', cls: 'mode-contrast' },
    { key: 'soft', label: 'Leitura Suave', cls: 'mode-soft' }
  ];
  var currentContrastIndex = 0;

  function toggleContrast() {
    currentContrastIndex = (currentContrastIndex + 1) % contrastModes.length;
    var mode = contrastModes[currentContrastIndex];
    if (paper) {
      paper.classList.remove('mode-contrast', 'mode-soft');
      if (mode.cls) paper.classList.add(mode.cls);
    }
    if (contrastModeLabel) contrastModeLabel.textContent = mode.label;
  }

  if (contrastBtn) {
    contrastBtn.addEventListener('click', toggleContrast);
  }

  // Gerenciamento de Pistas Fixadas na Sessão
  function getStorageKey(evidenceId) {
    return 'sombras_pinned_clues_' + (evidenceId || 'general');
  }

  function getPinnedClues(evidenceId) {
    try {
      var raw = sessionStorage.getItem(getStorageKey(evidenceId));
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function savePinnedClue(evidenceId, snippetText) {
    var trimmed = (snippetText || '').trim();
    if (!trimmed) return;
    var clues = getPinnedClues(evidenceId);
    if (clues.indexOf(trimmed) === -1) {
      clues.push(trimmed);
      try {
        sessionStorage.setItem(getStorageKey(evidenceId), JSON.stringify(clues));
      } catch (e) {}
    }
    window.dispatchEvent(new CustomEvent('clue:pinned', {
      detail: { evidenceId: evidenceId, text: trimmed }
    }));
    if (typeof window.showToast === 'function') {
      window.showToast('Pista Fixada', 'Trecho salvo no caderno da investigação.', 'success');
    }
  }

  // Restauração das pistas sem reprocessar HTML remoto.
  function wrapTextNode(node, clue) {
    if (!node || !node.parentNode || (node.parentNode.closest && node.parentNode.closest('mark.clue-highlight'))) return;
    var value = node.nodeValue || '';
    var needle = String(clue || '').toLocaleLowerCase();
    var index = value.toLocaleLowerCase().indexOf(needle);
    if (index < 0) return;
    var before = value.slice(0, index);
    var match = value.slice(index, index + String(clue).length);
    var after = value.slice(index + String(clue).length);
    var fragment = document.createDocumentFragment();
    if (before) fragment.appendChild(document.createTextNode(before));
    var mark = document.createElement('mark');
    mark.className = 'clue-highlight';
    mark.title = 'Pista fixada';
    mark.textContent = match;
    fragment.appendChild(mark);
    var afterNode = after ? document.createTextNode(after) : null;
    if (afterNode) fragment.appendChild(afterNode);
    node.parentNode.replaceChild(fragment, node);
    if (afterNode) wrapTextNode(afterNode, clue);
  }

  function restoreHighlights(container, evidenceId) {
    var clues = getPinnedClues(evidenceId);
    if (!container || !clues || !clues.length) return;
    var paragraphs = container.querySelectorAll('p');
    paragraphs.forEach(function(paragraph) {
      clues.forEach(function(clue) {
        var cleanClue = String(clue || '').trim();
        if (cleanClue.length < 3) return;
        var walker = document.createTreeWalker(paragraph, 4);
        var nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(function(node) { wrapTextNode(node, cleanClue); });
      });
    });
  }

  // Barra Flutuante de Seleção
  function updateSelectionToolbar() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount || !paper) {
      hideSelectionToolbar();
      return;
    }

    var range = sel.getRangeAt(0);
    // Assegura que a seleção está dentro do papel do documento
    if (!paper.contains(range.commonAncestorContainer)) {
      hideSelectionToolbar();
      return;
    }

    var text = sel.toString().trim();
    if (text.length < 2) {
      hideSelectionToolbar();
      return;
    }

    currentSelectedRange = range.cloneRange();
    var rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) {
      hideSelectionToolbar();
      return;
    }

    selectionBar.hidden = false;
    var topPos = rect.top - 10;
    var leftPos = rect.left + (rect.width / 2);

    // Ajuste se estiver muito próximo ao topo da tela
    if (topPos < 60) {
      topPos = rect.bottom + 45;
    }

    selectionBar.style.top = topPos + 'px';
    selectionBar.style.left = leftPos + 'px';
  }

  function hideSelectionToolbar() {
    if (selectionBar) selectionBar.hidden = true;
    currentSelectedRange = null;
  }

  if (paper) {
    paper.addEventListener('mouseup', function() {
      setTimeout(updateSelectionToolbar, 10);
    });
    paper.addEventListener('keyup', function(e) {
      if (['Shift', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) >= 0) {
        setTimeout(updateSelectionToolbar, 10);
      }
    });
  }

  document.addEventListener('selectionchange', function() {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed) {
      hideSelectionToolbar();
    }
  });

  if (pinClueBtn) {
    pinClueBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      var sel = window.getSelection();
      var text = (sel ? sel.toString() : '').trim();

      if (!text && currentSelectedRange) {
        text = currentSelectedRange.toString().trim();
      }

      if (text && currentSelectedRange) {
        var mark = document.createElement('mark');
        mark.className = 'clue-highlight';
        mark.title = 'Pista fixada';
        mark.textContent = text;
        try {
          currentSelectedRange.deleteContents();
          currentSelectedRange.insertNode(mark);
        } catch (err) {
          // Fallback se cruzou nós DOM
          restoreHighlights(paper, currentEvidenceId);
        }
        savePinnedClue(currentEvidenceId, text);
      }

      if (sel) sel.removeAllRanges();
      hideSelectionToolbar();
    });
  }

  // Abertura e Fechamento com Gestão Segura de Foco e Teclado (Esc)
  function openViewer(evidenceId) {
    var normalizedId = evidenceId && typeof evidenceId === 'object' ? evidenceId.id : evidenceId;
    if (!normalizedId) {
      currentEvidenceId = '';
      showError('Documento inválido.');
      return;
    }
    lastFocusedElement = document.activeElement;
    currentEvidenceId = String(normalizedId);
    hideSelectionToolbar();
    clearError();
    if (titleEl) titleEl.textContent = 'Carregando documento…';
    if (badgeEl) badgeEl.textContent = 'EVIDÊNCIA // ' + currentEvidenceId.toUpperCase();

    if (dialog) {
      if (typeof dialog.showModal === 'function') {
        try {
          if (!dialog.open) dialog.showModal();
        } catch (e) {
          dialog.setAttribute('open', '');
        }
      } else {
        dialog.setAttribute('open', '');
      }
    }

    if (returnBtn) {
      returnBtn.focus();
    }

    loadDocument(currentEvidenceId);
  }

  function closeViewer() {
    requestSerial++;
    hideSelectionToolbar();
    if (dialog) {
      if (typeof dialog.close === 'function') {
        try {
          if (dialog.open) dialog.close();
        } catch (e) {
          dialog.removeAttribute('open');
        }
      } else {
        dialog.removeAttribute('open');
      }
    }

    window.dispatchEvent(new CustomEvent('document:close', {
      detail: { evidenceId: currentEvidenceId }
    }));

    if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') {
      try {
        lastFocusedElement.focus();
      } catch (e) {}
    }
  }

  if (returnBtn) {
    returnBtn.addEventListener('click', closeViewer);
  }

  if (dialog) {
    dialog.addEventListener('cancel', function(e) {
      e.preventDefault();
      closeViewer();
    });
    dialog.addEventListener('click', function(e) {
      if (e.target === dialog) closeViewer();
    });
  }

  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      if (dialog && dialog.open) {
        e.preventDefault();
        closeViewer();
      }
    }
  });

  // Carregamento Seguro dos Dados Documentais
  function loadDocument(evidenceId) {
    var id = String(evidenceId || '');
    var serial = ++requestSerial;
    setBusy(true);
    clearError();
    if (paper) {
      paper.textContent = '';
      var placeholder = document.createElement('p');
      placeholder.className = 'doc-placeholder-text';
      placeholder.textContent = 'Carregando evidência documental...';
      paper.appendChild(placeholder);
    }

    function handleSuccess(response) {
      if (serial !== requestSerial) return;
      if (!response || !response.ok || !response.data) {
        showError(response && response.error && response.error.message || 'Não foi possível carregar o documento.');
        return;
      }

      var data = response.data;
      if (!data.title) {
        showError('O documento retornou dados incompletos.');
        return;
      }
      if (titleEl) titleEl.textContent = String(data.title);
      if (badgeEl) badgeEl.textContent = 'EVIDÊNCIA // ' + (id || 'DOC').toUpperCase();

      if (paper) {
        paper.textContent = '';
        var h3 = document.createElement('h3');
        h3.textContent = String(data.title);
        paper.appendChild(h3);

        var nature = document.createElement('p');
        nature.className = 'doc-placeholder-text';
        nature.textContent = data.contentNatureLabel || 'NATUREZA NÃO CLASSIFICADA — REVISÃO DOCENTE';
        paper.appendChild(nature);
        var natureNote = document.createElement('p');
        natureNote.className = 'doc-placeholder-text';
        natureNote.textContent = data.natureNote || 'Natureza do conteúdo não informada; requer revisão docente.';
        paper.appendChild(natureNote);
        var provenance = [data.sourceTitle, data.sourceOrganization, data.sourceVersion ? 'Versão: ' + data.sourceVersion : '', data.sourceUrl ? 'URL: ' + data.sourceUrl : '', data.accessedAt ? 'Acesso: ' + data.accessedAt : ''].filter(Boolean).join(' · ');
        if (provenance) {
          var provenanceEl = document.createElement('p');
          provenanceEl.className = 'doc-placeholder-text';
          provenanceEl.textContent = 'Proveniência: ' + provenance;
          paper.appendChild(provenanceEl);
        }
        if (data.ageBand) {
          var age = document.createElement('p');
          age.className = 'doc-placeholder-text';
          age.textContent = 'Faixa de uso: ' + data.ageBand;
          paper.appendChild(age);
        }
        if (data.pedagogicalObjective) {
          var objective = document.createElement('p');
          objective.className = 'doc-placeholder-text';
          objective.textContent = 'Objetivo pedagógico: ' + data.pedagogicalObjective;
          paper.appendChild(objective);
        }

        var safeVisualUrl = typeof data.dataUrl === 'string' && /^data:image\/(?:png|jpe?g|gif|webp|svg\+xml);base64,/i.test(data.dataUrl);
        var hasVisual = Boolean((data.isImage || data.isSvg) && safeVisualUrl);
        if (hasVisual) {
          var img = document.createElement('img');
          img.src = data.dataUrl;
          img.alt = String(data.title || 'Documento visual da investigação');
          img.setAttribute('decoding', 'async');
          img.style.maxWidth = '100%';
          img.style.height = 'auto';
          img.style.borderRadius = '4px';
          img.style.boxShadow = '0 4px 16px rgba(0, 0, 0, 0.4)';
          img.style.margin = '14px 0 20px 0';
          img.style.border = '1px solid var(--doc-line)';
          paper.appendChild(img);
        }

        var rawText = data.text || '';
        if (hasVisual && data.isSvg && !data.text) rawText = '';
        var paragraphs = String(rawText || 'Conteúdo documental indisponível para leitura.').split(/\r?\n\s*\r?\n/);
        paragraphs.forEach(function(para) {
          var trimmed = para.trim();
          if (trimmed && (!hasVisual || trimmed.indexOf('[Documento visual:') !== 0)) {
            var p = document.createElement('p');
            p.textContent = trimmed;
            paper.appendChild(p);
          }
        });

        // Restaura destaques fixados anteriormente nesta sessão
        restoreHighlights(paper, id);
      }
      setBusy(false);
      clearError();
      try { if (paper) paper.focus(); } catch (e) {}
    }

    function handleFailure() {
      if (serial === requestSerial) showError('Falha na conexão ao carregar o documento. Tente novamente.');
    }

    if (!id) {
      showError('Documento inválido.');
      return;
    }
    var userId = restoreUserId();
    if (!userId) {
      showError('Sua sessão não está ativa. Entre novamente para consultar o documento.');
      return;
    }
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(handleSuccess)
        .withFailureHandler(handleFailure)
        .getDocumentMetadata(userId, id);
    } else {
      handleFailure();
    }
  }

  if (retryBtn) retryBtn.addEventListener('click', function() { loadDocument(currentEvidenceId); });

  // Ouvinte de Eventos Globais
  window.addEventListener('document:open', function(event) {
    var detail = event && event.detail;
    var id = detail && typeof detail === 'object' ? detail.id : detail;
    openViewer(id);
  });
}());
</script>
