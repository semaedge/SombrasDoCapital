<!--
  O TERMINAL: SOMBRAS DO CAPITAL
  Componente: 12_TimerWidget.html
  Camada: Interface HTML do Google Apps Script
  Tipo: Temporizador reutilizável

  PRINCIPAIS FUNCIONALIDADES
  Contagem regressiva precisa para decisões com urgência, pausa, retomada e expiração.

  INTEGRAÇÕES
  Responde aos eventos timer:start, timer:pause, timer:resume, timer:reset e timer:stop;
  emite timer:expired uma única vez por execução.

  ESTADOS E ACESSIBILIDADE
  O valor numérico não é anunciado a cada segundo. Avisos audíveis ficam reservados para
  início, pausa, retomada, limiares de urgência e encerramento.
-->
<section data-component="12_TimerWidget" aria-labelledby="timer-widget-title">
  <style>
    [data-component="12_TimerWidget"] .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    [data-component="12_TimerWidget"] { display: inline-flex; align-items: baseline; gap: 10px; padding: 12px 16px; color: var(--color-neon-cyan); background: var(--color-dark-graphite); border: 1px solid var(--color-slate-gray); font-family: "Courier New", monospace; }
    [data-component="12_TimerWidget"] .timer { margin: 0; font-size: 18px; font-variant-numeric: tabular-nums; }
    [data-component="12_TimerWidget"] .timer[data-tone="amber"] { color: var(--color-warning-amber); }
    [data-component="12_TimerWidget"] .timer[data-tone="red"] { color: var(--color-coral-red); }
    [data-component="12_TimerWidget"] .timer-status { margin: 0; color: var(--color-medium-gray); font-size: 10px; line-height: 1.4; }
    [data-component="12_TimerWidget"][data-state="urgent"] { border-color: var(--color-warning-amber); }
    [data-component="12_TimerWidget"][data-state="expired"] { border-color: var(--color-coral-red); }
    @media (max-width: 420px) { [data-component="12_TimerWidget"] { align-items: flex-start; flex-direction: column; gap: 4px; } }
  </style>
  <h2 id="timer-widget-title" class="sr-only">Tempo restante da decisão</h2>
  <p class="timer" id="timer-display" role="timer" aria-live="off" aria-atomic="true" aria-label="Tempo restante: 00:00">00:00</p>
  <p class="timer-status" id="timer-status" role="status" aria-live="polite" aria-atomic="true">Temporizador pausado.</p>
</section>
<script>
(function() {
  var root = document.querySelector('[data-component="12_TimerWidget"]');
  if (!root) return;

  var display = root.querySelector('#timer-display');
  var status = root.querySelector('#timer-status');
  if (!display || !status) return;

  var remaining = 0;
  var initialDuration = 0;
  var deadline = 0;
  var interval = null;
  var paused = true;
  var expired = false;
  var lastAnnouncement = null;

  function formatTime(seconds) {
    var safeSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
    var minutes = Math.floor(safeSeconds / 60);
    var secondsPart = safeSeconds % 60;
    return String(minutes).padStart(2, '0') + ':' + String(secondsPart).padStart(2, '0');
  }

  function setStatus(message, state) {
    root.dataset.state = state || (paused ? 'paused' : 'running');
    status.textContent = message;
  }

  function render() {
    var label = formatTime(remaining);
    display.textContent = label;
    display.setAttribute('aria-label', 'Tempo restante: ' + label);
    display.dataset.tone = expired ? 'red' : remaining <= 15 && remaining > 0 ? 'red' : remaining <= 60 && remaining > 0 ? 'amber' : '';
  }

  function stopInterval() {
    if (interval) window.clearInterval(interval);
    interval = null;
  }

  function announceThreshold() {
    var threshold = remaining <= 5 && remaining > 0 ? 5 : remaining <= 15 && remaining > 0 ? 15 : remaining <= 30 && remaining > 0 ? 30 : remaining <= 60 && remaining > 0 ? 60 : null;
    if (threshold && threshold !== lastAnnouncement) {
      lastAnnouncement = threshold;
      root.dataset.state = 'urgent';
      status.textContent = 'Atenção: restam ' + formatTime(remaining) + ' para registrar a decisão.';
    }
  }

  function emitExpired() {
    if (expired) return;
    expired = true;
    paused = true;
    remaining = 0;
    deadline = 0;
    stopInterval();
    render();
    setStatus('Tempo encerrado. A decisão deve ser registrada como inação.', 'expired');
    window.dispatchEvent(new CustomEvent('timer:expired', { detail: { remaining: 0, duration: initialDuration } }));
  }

  function tick() {
    if (paused || expired) return;
    var nextRemaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    if (nextRemaining !== remaining) {
      remaining = nextRemaining;
      render();
      announceThreshold();
    }
    if (remaining <= 0) emitExpired();
  }

  function start(duration) {
    var parsed = Number(duration);
    if (!isFinite(parsed) || parsed < 0) return;
    stopInterval();
    initialDuration = Math.floor(parsed);
    remaining = initialDuration;
    expired = false;
    paused = false;
    lastAnnouncement = null;
    deadline = Date.now() + remaining * 1000;
    render();
    if (remaining <= 0) {
      emitExpired();
      return;
    }
    setStatus('Temporizador iniciado com ' + formatTime(remaining) + '.', 'running');
    interval = window.setInterval(tick, 250);
  }

  function pause() {
    if (paused || expired) return;
    tick();
    if (expired) return;
    paused = true;
    stopInterval();
    deadline = 0;
    setStatus('Temporizador pausado em ' + formatTime(remaining) + '.', 'paused');
    window.dispatchEvent(new CustomEvent('timer:paused', { detail: { remaining: remaining, duration: initialDuration } }));
  }

  function resume() {
    if (!paused || expired || remaining <= 0) return;
    paused = false;
    deadline = Date.now() + remaining * 1000;
    setStatus('Temporizador retomado. Restam ' + formatTime(remaining) + '.', 'running');
    stopInterval();
    interval = window.setInterval(tick, 250);
  }

  function reset(duration) {
    var value = duration == null ? initialDuration : duration;
    start(value);
  }

  function stop() {
    paused = true;
    stopInterval();
    deadline = 0;
    setStatus('Temporizador interrompido em ' + formatTime(remaining) + '.', 'paused');
  }

  window.addEventListener('timer:start', function(event) {
    start(event.detail && event.detail.duration);
  });
  window.addEventListener('timer:pause', pause);
  window.addEventListener('timer:resume', resume);
  window.addEventListener('timer:reset', function(event) {
    reset(event.detail && event.detail.duration);
  });
  window.addEventListener('timer:stop', stop);

  render();
}());
</script>
