<!--
  O TERMINAL: SOMBRAS DO CAPITAL
  Componente: 21_ChoiceHistory.html
  Camada: Interface HTML do Google Apps Script
  Tipo: Histórico de escolhas com estados e leitura acessíveis

  PRINCIPAIS FUNCIONALIDADES
  Histórico de escolhas.

  INTEGRAÇÕES
  Revisa decisões, consequências e evidências usadas.

  CONTRATO DE FRONTEND
  - Consumir somente funções públicas expostas pelo controlador do Apps Script.
  - Nunca armazenar senha em localStorage, URL, HTML ou logs do navegador.
  - Escapar conteúdo narrativo antes de inserir HTML; preferir textContent no JavaScript.
  - Manter estados loading, vazio, sucesso e erro acessíveis.

  CONTRATO DE DADOS
  - Consumir apenas dados necessários à tela e respeitar o contrato JSON da API.
  - Não presumir campos opcionais: tratar ausência, lista vazia e resposta parcial.
  - Enviar mutações uma única vez e refletir sucesso ou erro no estado visível.

  ESTADOS E ACESSIBILIDADE
  - Implementar loading, vazio, sucesso, erro e estado desabilitado quando aplicável.
  - Preservar foco, ordem de teclado, labels associados e mensagens anunciáveis.
  - Não depender apenas de cor, animação, áudio ou hover para comunicar informação.

  SEGURANÇA E LIMITES
  - Nunca expor senha, token, dados pessoais ou detalhes técnicos no DOM ou nos logs.
  - Conteúdo remoto deve ser tratado como texto não confiável e inserido com segurança.
  - Este componente não implementa autorização, persistência ou regras de domínio.

  DIRETRIZES VISUAIS
  Interface de sistema investigativo em dark graphite, com neon apenas para evidências,
  links cruciais e estados de interação. O componente deve ser responsivo e legível para
  estudantes do Ensino Médio, com foco em narrativa, análise de dados e acessibilidade.

  STATUS DO COMPONENTE
  Implementação produtiva com histórico estruturado, métricas e estados operacionais.
-->
<section data-component="21_ChoiceHistory" aria-labelledby="choice-history-title" aria-describedby="choice-history-description" aria-busy="false">
  <header class="history-header">
    <div>
      <div class="history-tag">[ RASTRO // DECISÕES REGISTRADAS ]</div>
      <h2 id="choice-history-title">Histórico de escolhas</h2>
      <p id="choice-history-description" class="history-intro">Revise as decisões tomadas e o efeito de cada uma sobre o rigor documental e a velocidade da investigação.</p>
    </div>
    <button type="button" id="history-refresh" class="history-action" aria-label="Atualizar histórico de escolhas">ATUALIZAR</button>
  </header>

  <p data-state="loading" id="choice-history-loading" class="history-state" hidden role="status" aria-live="polite" aria-atomic="true">Carregando histórico…</p>
  <p data-state="empty" id="choice-history-empty" class="history-state" hidden role="status" aria-live="polite" aria-atomic="true">Nenhuma decisão foi registrada nesta sessão.</p>
  <p data-state="error" id="choice-history-status" class="history-state history-error" hidden role="alert" aria-live="assertive" aria-atomic="true" tabindex="-1">Não foi possível carregar o histórico.</p>
  <button type="button" id="history-retry" class="history-action history-retry" hidden>TENTAR NOVAMENTE</button>

  <div data-slot="content" class="history-content" aria-live="polite" aria-atomic="false"></div>
</section>

<style>
  [data-component="21_ChoiceHistory"] {
    --history-bg: var(--color-deep-shadow, #0b1012);
    --history-panel: var(--color-dark-graphite, #161d20);
    --history-line: var(--color-slate-gray, #2a363b);
    --history-cyan: var(--color-neon-cyan, #68d4d0);
    --history-amber: var(--color-warning-amber, #e6b65c);
    --history-red: var(--color-coral-red, #e27468);
    --history-ink: var(--color-light-gray, #dbe3e6);
    --history-muted: var(--color-medium-gray, #91a2a8);
    display: block;
    padding: 24px;
    background: var(--history-bg);
    color: var(--history-ink);
    border: 1px solid var(--history-line);
    font-family: "IBM Plex Mono", "Courier New", monospace;
    box-sizing: border-box;
  }

  [data-component="21_ChoiceHistory"] .history-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--history-line);
  }

  [data-component="21_ChoiceHistory"] .history-tag {
    margin-bottom: 6px;
    color: var(--history-cyan);
    font-size: 10px;
    letter-spacing: .14em;
  }

  [data-component="21_ChoiceHistory"] h2 {
    margin: 0 0 8px;
    color: #ffffff;
    font: 700 clamp(22px, 3vw, 28px)/1.1 Georgia, serif;
  }

  [data-component="21_ChoiceHistory"] .history-intro {
    max-width: 720px;
    margin: 0;
    color: var(--history-muted);
    font-size: 12px;
    line-height: 1.5;
  }

  [data-component="21_ChoiceHistory"] .history-action {
    flex: 0 0 auto;
    padding: 9px 12px;
    border: 1px solid var(--history-cyan);
    border-radius: 3px;
    background: transparent;
    color: var(--history-cyan);
    font: 700 10px/1.2 "IBM Plex Mono", monospace;
    letter-spacing: .08em;
    cursor: pointer;
  }

  [data-component="21_ChoiceHistory"] .history-action:hover {
    background: rgba(104, 212, 208, .12);
  }

  [data-component="21_ChoiceHistory"] .history-action:focus-visible {
    outline: 2px solid var(--history-amber);
    outline-offset: 2px;
  }

  [data-component="21_ChoiceHistory"] .history-action:disabled {
    cursor: wait;
    opacity: .55;
  }

  [data-component="21_ChoiceHistory"] .history-state {
    margin: 16px 0;
    padding: 12px 16px;
    border-left: 3px solid var(--history-cyan);
    background: var(--history-panel);
    color: var(--history-ink);
    font-size: 12px;
    line-height: 1.5;
  }

  [data-component="21_ChoiceHistory"] .history-error {
    border-left-color: var(--history-red);
    color: #f7a8a0;
  }

  [data-component="21_ChoiceHistory"] .history-retry {
    margin-bottom: 16px;
  }

  [data-component="21_ChoiceHistory"] .history-list {
    display: grid;
    gap: 14px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  [data-component="21_ChoiceHistory"] .history-entry {
    padding: 18px;
    background: var(--history-panel);
    border: 1px solid var(--history-line);
    border-radius: 4px;
    transition: border-color .18s ease, transform .18s ease;
  }

  [data-component="21_ChoiceHistory"] .history-entry:hover {
    border-color: var(--history-cyan);
    transform: translateY(-1px);
  }

  [data-component="21_ChoiceHistory"] .entry-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 10px;
  }

  [data-component="21_ChoiceHistory"] .entry-heading h3 {
    margin: 0;
    color: #ffffff;
    font: 700 16px/1.25 Georgia, serif;
  }

  [data-component="21_ChoiceHistory"] .entry-date {
    flex: 0 0 auto;
    color: var(--history-muted);
    font-size: 10px;
  }

  [data-component="21_ChoiceHistory"] .entry-choice,
  [data-component="21_ChoiceHistory"] .entry-consequence {
    margin: 6px 0 0;
    font-size: 12px;
    line-height: 1.5;
  }

  [data-component="21_ChoiceHistory"] .entry-choice {
    color: var(--history-amber);
  }

  [data-component="21_ChoiceHistory"] .entry-consequence {
    color: var(--history-ink);
  }

  [data-component="21_ChoiceHistory"] .entry-label {
    color: var(--history-muted);
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  [data-component="21_ChoiceHistory"] .entry-metrics {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin: 16px 0 0;
  }

  [data-component="21_ChoiceHistory"] .metric {
    margin: 0;
    padding: 10px 12px;
    background: #0e1416;
    border: 1px solid #253338;
    border-radius: 3px;
  }

  [data-component="21_ChoiceHistory"] .metric dt {
    margin-bottom: 4px;
    color: var(--history-muted);
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  [data-component="21_ChoiceHistory"] .metric dd {
    margin: 0;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
  }

  [data-component="21_ChoiceHistory"] .metric-positive { color: var(--history-cyan) !important; }
  [data-component="21_ChoiceHistory"] .metric-negative { color: var(--history-red) !important; }
  [data-component="21_ChoiceHistory"] .metric-neutral { color: var(--history-muted) !important; }

  @media (max-width: 560px) {
    [data-component="21_ChoiceHistory"] {
      padding: 16px;
    }

    [data-component="21_ChoiceHistory"] .history-header,
    [data-component="21_ChoiceHistory"] .entry-heading {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    [data-component="21_ChoiceHistory"] .history-action {
      align-self: flex-start;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    [data-component="21_ChoiceHistory"] .history-entry {
      transition: none;
    }

    [data-component="21_ChoiceHistory"] .history-entry:hover {
      transform: none;
    }
  }
</style>

<script>
(function() {
  var root = document.querySelector('[data-component="21_ChoiceHistory"]');
  if (!root) return;

  var loading = root.querySelector('[data-state="loading"]');
  var empty = root.querySelector('[data-state="empty"]');
  var error = root.querySelector('[data-state="error"]');
  var content = root.querySelector('[data-slot="content"]');
  var refresh = root.querySelector('#history-refresh');
  var retry = root.querySelector('#history-retry');
  var requestSerial = 0;

  function displayText(value, fallback) {
    if (typeof value === 'string') {
      var trimmed = value.trim();
      return trimmed || fallback;
    }
    if (typeof value === 'number' && isFinite(value)) return String(value);
    return fallback;
  }

  function readDelta(value) {
    if (value === null || value === undefined || value === '') return null;
    var number = Number(value);
    return isFinite(number) ? number : null;
  }

  function deltaLabel(value) {
    if (value === null) return '—';
    return (value > 0 ? '+' : '') + String(value);
  }

  function formatDate(value) {
    if (value === null || value === undefined || value === '') return null;
    var date = new Date(value);
    if (isNaN(date.getTime())) return null;

    var label;
    try {
      label = new Intl.DateTimeFormat('pt-BR', {
        dateStyle: 'short',
        timeStyle: 'short'
      }).format(date);
    } catch (ignored) {
      label = date.toLocaleString('pt-BR');
    }
    return { label: label, iso: date.toISOString() };
  }

  function restoreUserId() {
    if (window.currentUserId) return String(window.currentUserId);
    try {
      var saved = JSON.parse(window.localStorage.getItem('sombras.session') || 'null');
      if (!saved || !saved.user || !saved.user.id) return '';
      window.currentUser = saved.user;
      window.currentUserId = String(saved.user.id);
      return window.currentUserId;
    } catch (ignored) {
      return '';
    }
  }

  function setBusy(isBusy) {
    root.setAttribute('aria-busy', isBusy ? 'true' : 'false');
    if (loading) loading.hidden = !isBusy;
    if (refresh) refresh.disabled = isBusy;
    if (isBusy) {
      if (empty) empty.hidden = true;
      if (error) error.hidden = true;
      if (retry) retry.hidden = true;
    }
  }

  function showError(message, canRetry) {
    setBusy(false);
    if (content) content.textContent = '';
    if (empty) empty.hidden = true;
    if (error) {
      error.textContent = message;
      error.hidden = false;
      error.focus();
    }
    if (retry) retry.hidden = !canRetry;
  }

  function normalizeHistory(data) {
    if (!Array.isArray(data)) return null;
    return data.filter(function(item) {
      return item && typeof item === 'object' && !Array.isArray(item);
    });
  }

  function appendMetric(metrics, label, value) {
    var metric = document.createElement('div');
    metric.className = 'metric';

    var term = document.createElement('dt');
    term.textContent = label;
    metric.appendChild(term);

    var definition = document.createElement('dd');
    var tone = value === null ? 'neutral' : value > 0 ? 'positive' : value < 0 ? 'negative' : 'neutral';
    definition.className = 'metric-' + tone;
    definition.setAttribute('aria-label', label + ': ' + deltaLabel(value));
    definition.textContent = deltaLabel(value);
    metric.appendChild(definition);
    metrics.appendChild(metric);
  }

  function renderHistory(items) {
    if (!content) return;
    content.textContent = '';

    if (!items.length) {
      if (empty) empty.hidden = false;
      return;
    }
    if (empty) empty.hidden = true;

    var list = document.createElement('ol');
    list.className = 'history-list';
    list.setAttribute('aria-label', 'Decisões registradas');

    items.forEach(function(item, index) {
      var scene = displayText(item.sceneId, 'Cena não identificada');
      var choice = displayText(item.choice, 'Escolha não informada');
      var consequence = displayText(item.consequence, 'Consequência não informada.');
      var date = formatDate(item.createdAt);
      var rigor = readDelta(item.documentaryRigorDelta);
      var speed = readDelta(item.speedDelta);

      var entry = document.createElement('li');
      entry.className = 'history-entry';
      entry.setAttribute('aria-labelledby', 'history-entry-title-' + index);
      entry.setAttribute('aria-posinset', String(index + 1));
      entry.setAttribute('aria-setsize', String(items.length));

      var heading = document.createElement('div');
      heading.className = 'entry-heading';
      var title = document.createElement('h3');
      title.id = 'history-entry-title-' + index;
      title.textContent = scene;
      heading.appendChild(title);

      if (date) {
        var time = document.createElement('time');
        time.className = 'entry-date';
        time.dateTime = date.iso;
        time.textContent = date.label;
        heading.appendChild(time);
      }
      entry.appendChild(heading);

      var choiceLine = document.createElement('p');
      choiceLine.className = 'entry-choice';
      var choiceLabel = document.createElement('span');
      choiceLabel.className = 'entry-label';
      choiceLabel.textContent = 'Escolha: ';
      choiceLine.appendChild(choiceLabel);
      choiceLine.appendChild(document.createTextNode(choice));
      entry.appendChild(choiceLine);

      var consequenceLine = document.createElement('p');
      consequenceLine.className = 'entry-consequence';
      var consequenceLabel = document.createElement('span');
      consequenceLabel.className = 'entry-label';
      consequenceLabel.textContent = 'Consequência: ';
      consequenceLine.appendChild(consequenceLabel);
      consequenceLine.appendChild(document.createTextNode(consequence));
      entry.appendChild(consequenceLine);

      var metrics = document.createElement('dl');
      metrics.className = 'entry-metrics';
      appendMetric(metrics, 'Rigor documental', rigor);
      appendMetric(metrics, 'Velocidade', speed);
      entry.appendChild(metrics);
      list.appendChild(entry);
    });

    content.appendChild(list);
  }

  function load() {
    var currentRequest = ++requestSerial;
    setBusy(true);
    var playerId = restoreUserId();

    if (!playerId) {
      showError('Sua sessão não está ativa. Entre novamente para consultar o histórico.', true);
      return;
    }

    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(response) {
          if (currentRequest !== requestSerial) return;
          if (!response || !response.ok) {
            showError('Não foi possível carregar o histórico de escolhas.', true);
            return;
          }
          var items = normalizeHistory(response.data);
          if (!items) {
            showError('O servidor devolveu um formato de histórico inválido.', true);
            return;
          }
          setBusy(false);
          renderHistory(items);
        })
        .withFailureHandler(function() {
          if (currentRequest !== requestSerial) return;
          showError('Falha de comunicação com o servidor. Tente novamente.', true);
        })
        .getChoiceHistory(playerId);
    } else {
      showError('Servidor indisponível. Tente novamente quando a conexão estiver pronta.', true);
    }
  }

  if (refresh) refresh.addEventListener('click', load);
  if (retry) retry.addEventListener('click', load);
  load();
}());
</script>
