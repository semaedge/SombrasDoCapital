<!--
  O TERMINAL: SOMBRAS DO CAPITAL
  Componente: 34_ErrorState.html
  Camada: Interface HTML do Google Apps Script
  Tipo: Estado de erro recuperável e acessível

  PRINCIPAIS FUNCIONALIDADES
  Estado de erro.

  INTEGRAÇÕES
  Mensagem segura, código de correlação e opção de tentar novamente.

  CONTRATO DE FRONTEND
  - Consumir somente funções públicas expostas pelo controlador do Apps Script.
  - Nunca armazenar senha em localStorage, URL, HTML ou logs do navegador.
  - Escapar conteúdo narrativo antes de inserir HTML; preferir textContent no JavaScript.
  - Manter estados loading, vazio, sucesso e erro acessíveis.

  CONTRATO DE DADOS
  - Consumir apenas dados necessários à tela e respeitar o contrato JSON da API.
  - Não presumir campos opcionais: tratar ausência, lista vazia e resposta parcial.
  - Enviar mutações uma única vez e refletir sucesso ou erro no estado visível.

  ESTADOS E ACESSIBILIDADE
  - Implementar loading, vazio, sucesso, erro e estado desabilitado quando aplicável.
  - Preservar foco, ordem de teclado, labels associados e mensagens anunciáveis.
  - Não depender apenas de cor, animação, áudio ou hover para comunicar informação.

  SEGURANÇA E LIMITES
  - Nunca expor senha, token, dados pessoais ou detalhes técnicos no DOM ou nos logs.
  - Conteúdo remoto deve ser tratado como texto não confiável e inserido com segurança.
  - Este componente não implementa autorização, persistência ou regras de domínio.

  DIRETRIZES VISUAIS
  Interface de sistema investigativo em dark graphite, com neon apenas para evidências,
  links cruciais e estados de interação. O componente deve ser responsivo e legível para
  estudantes do Ensino Médio, com foco em narrativa, análise de dados e acessibilidade.

  STATUS DA IMPLEMENTAÇÃO
  Estado configurável por atributos ou pelo evento error:show, com mensagem pública segura,
  correlação sanitizada, foco, tentativa de recuperação e retorno ao acesso.
-->
<section data-component="34_ErrorState" aria-labelledby="error-state-heading" aria-describedby="error-state-description" aria-busy="false">
  <style>
    [data-component="34_ErrorState"] { --error-bg: var(--color-deep-shadow); --error-panel: var(--color-dark-graphite); --error-line: #293539; --error-red: var(--color-coral-red); --error-amber: var(--color-warning-amber); --error-cyan: var(--color-neon-cyan); display: grid; min-height: 60vh; place-items: center; padding: 28px; color: var(--color-light-gray); background: var(--error-bg); font-family: "IBM Plex Mono", "Courier New", monospace; }
    [data-component="34_ErrorState"] *, [data-component="34_ErrorState"] *::before, [data-component="34_ErrorState"] *::after { box-sizing: border-box; }
    [data-component="34_ErrorState"] .error-panel { width: min(100%, 620px); padding: clamp(22px, 5vw, 38px); border: 1px solid var(--error-line); border-top: 3px solid var(--error-red); background: var(--error-panel); box-shadow: 12px 12px 0 rgba(16, 21, 23, .7); }
    [data-component="34_ErrorState"] .error-mark { color: var(--error-red); font-size: 10px; letter-spacing: .14em; }
    [data-component="34_ErrorState"] h2 { margin: 12px 0 8px; color: #fff; font: 700 clamp(24px, 4vw, 34px) Georgia, serif; }
    [data-component="34_ErrorState"] .error-description { margin: 0; color: var(--color-medium-gray); font-size: 12px; line-height: 1.6; }
    [data-component="34_ErrorState"] .error-message { margin: 22px 0 0; padding: 14px 16px; border-left: 3px solid var(--error-red); color: #f7b0a8; background: rgba(226, 116, 104, .08); font-size: 12px; line-height: 1.55; }
    [data-component="34_ErrorState"] .error-code { margin: 12px 0 0; color: var(--color-medium-gray); font-size: 10px; }
    [data-component="34_ErrorState"] .error-code strong { color: var(--error-amber); font-weight: 400; }
    [data-component="34_ErrorState"] .error-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    [data-component="34_ErrorState"] button, [data-component="34_ErrorState"] a { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 9px 14px; border: 1px solid var(--error-cyan); border-radius: 3px; color: var(--error-cyan); background: transparent; font: 700 11px "IBM Plex Mono", monospace; text-decoration: none; cursor: pointer; }
    [data-component="34_ErrorState"] button.primary { color: #071011; background: var(--error-cyan); }
    [data-component="34_ErrorState"] button:hover:not(:disabled), [data-component="34_ErrorState"] a:hover { filter: brightness(1.12); }
    [data-component="34_ErrorState"] button:focus-visible, [data-component="34_ErrorState"] a:focus-visible { outline: 2px solid var(--error-amber); outline-offset: 3px; }
    [data-component="34_ErrorState"] button:disabled { cursor: wait; opacity: .55; }
    [data-component="34_ErrorState"] .retry-status { min-height: 18px; margin: 16px 0 0; color: var(--color-medium-gray); font-size: 11px; line-height: 1.5; }
    [data-component="34_ErrorState"] .retry-status[data-state="success"] { color: #a7e4be; }
    @media (max-width: 520px) { [data-component="34_ErrorState"] { padding: 16px; } [data-component="34_ErrorState"] .error-actions { flex-direction: column; } [data-component="34_ErrorState"] button, [data-component="34_ErrorState"] a { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { [data-component="34_ErrorState"] * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
  <div class="error-panel">
    <span class="error-mark">[ TERMINAL // RECUPERAÇÃO ]</span>
    <h2 id="error-state-heading">Não foi possível concluir</h2>
    <p id="error-state-description" class="error-description">O terminal encontrou uma falha pública e interrompeu a operação para proteger seus dados.</p>
    <p data-state="error" id="error-state-message" class="error-message" role="alert" aria-live="assertive" aria-atomic="true" tabindex="-1">Não foi possível concluir a operação.</p>
    <p class="error-code" id="error-state-code" hidden><strong>Código de correlação:</strong> <span></span></p>
    <div class="error-actions">
      <button type="button" id="error-retry" class="primary"><span aria-hidden="true">↻</span> Tentar novamente</button>
      <a id="error-login" href="?page=02_Login">Voltar ao acesso</a>
    </div>
    <p id="error-retry-status" class="retry-status" hidden role="status" aria-live="polite" aria-atomic="true"></p>
  </div>
</section>
<script>
(function() {
  var root = document.querySelector('[data-component="34_ErrorState"]');
  if (!root) return;
  var message = root.querySelector('#error-state-message');
  var code = root.querySelector('#error-state-code');
  var codeValue = code && code.querySelector('span');
  var retry = root.querySelector('#error-retry');
  var retryStatus = root.querySelector('#error-retry-status');
  var fallbackMessage = 'Não foi possível concluir a operação.';
  var retryTimer = null;

  function safeCode(value) {
    var normalized = String(value == null ? '' : value).trim().replace(/[^a-z0-9_-]/gi, '').slice(0, 48);
    return normalized;
  }

  function publicMessage(errorCode, candidate) {
    var known = {
      authentication_unavailable: 'O serviço de autenticação está indisponível. Tente novamente.',
      invalid_credentials: 'Não foi possível validar as credenciais informadas.',
      forbidden: 'Você não tem permissão para realizar esta operação.',
      unauthenticated: 'Sua sessão não está ativa. Entre novamente para continuar.',
      report_unavailable: 'O relatório ainda não está disponível para consulta.',
      content_not_saved: 'O conteúdo não foi salvo. Revise os dados e tente novamente.'
    };
    var key = String(errorCode || '').toLowerCase();
    if (known[key]) return known[key];
    return String(candidate || '').trim().slice(0, 240) || fallbackMessage;
  }

  function showError(detail) {
    var data = detail || {};
    var errorCode = safeCode(data.code || root.getAttribute('data-error-code'));
    var text = publicMessage(errorCode, data.message || root.getAttribute('data-error-message'));
    if (message) message.textContent = text;
    if (code && codeValue && safeCode(data.correlation_id || root.getAttribute('data-correlation-id'))) {
      codeValue.textContent = safeCode(data.correlation_id || root.getAttribute('data-correlation-id'));
      code.hidden = false;
    } else if (code) {
      code.hidden = true;
    }
    root.setAttribute('aria-busy', 'false');
    if (retryStatus) retryStatus.hidden = true;
  }

  if (retry) retry.addEventListener('click', function() {
    if (retryTimer) return;
    retry.disabled = true;
    root.setAttribute('aria-busy', 'true');
    if (retryStatus) {
      retryStatus.textContent = 'Solicitando uma nova tentativa…';
      retryStatus.hidden = false;
      retryStatus.removeAttribute('data-state');
    }
    var retryEvent = new CustomEvent('error:retry', { detail: { code: codeValue ? codeValue.textContent : '' }, cancelable: true });
    var handled = !window.dispatchEvent(retryEvent);
    retryTimer = setTimeout(function() {
      retryTimer = null;
      retry.disabled = false;
      root.setAttribute('aria-busy', 'false');
      if (retryStatus) {
        retryStatus.textContent = handled ? 'Nova tentativa solicitada.' : 'Não foi possível iniciar a nova tentativa automaticamente.';
        retryStatus.hidden = false;
        retryStatus.setAttribute('data-state', handled ? 'success' : 'error');
      }
      if (!handled) {
        try { window.location.reload(); } catch (ignored) {}
      }
    }, 650);
  });

  window.addEventListener('error:show', function(event) { showError(event && event.detail); });
  showError({});
}());
</script>
